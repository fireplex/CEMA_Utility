  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="34" font-weight="900" fill="#38bdf8" letter-spacing="6" text-anchor="middle">CEMA</text>
